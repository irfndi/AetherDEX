name: Deploy staging canary

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: staging-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy staging canary
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHAIN_ID: ${{ secrets.CHAIN_ID }}
      RPC_URL: ${{ secrets.RPC_URL }}
      AETHERDEX_HOOK: ${{ secrets.AETHERDEX_HOOK }}
      AETHERDEX_TREASURY: ${{ secrets.AETHERDEX_TREASURY }}
      AETHERDEX_ROUTER: ${{ secrets.AETHERDEX_ROUTER }}
      AETHERDEX_FACTORY: ${{ secrets.AETHERDEX_FACTORY }}
      AETHERDEX_POSITION_MANAGER: ${{ secrets.AETHERDEX_POSITION_MANAGER }}
      AETHERDEX_POOL_MANAGER: ${{ secrets.AETHERDEX_POOL_MANAGER }}
      VITE_REOWN_PROJECT_ID: ${{ secrets.VITE_REOWN_PROJECT_ID }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate deployment inputs
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CHAIN_ID RPC_URL AETHERDEX_HOOK AETHERDEX_TREASURY AETHERDEX_ROUTER AETHERDEX_FACTORY AETHERDEX_POSITION_MANAGER AETHERDEX_POOL_MANAGER VITE_REOWN_PROJECT_ID VITE_API_URL; do
            test -n "${!name:-}" || { echo "Missing staging secret: $name" >&2; exit 1; }
          done

      - name: Deploy Cloudflare staging infrastructure
        working-directory: infra/alchemy
        run: bun run deploy:staging

      - name: Deploy staging Pages canary
        working-directory: infra/alchemy
        run: bun run web:deploy:staging

      - name: Smoke test staging API
        run: |
          curl --fail --retry 5 --retry-delay 3 "$VITE_API_URL/ping"
          curl --fail --retry 5 --retry-delay 3 "${VITE_API_URL%/api/v1}/health"
