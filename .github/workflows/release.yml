name: Production release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version-guard:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Require a main branch tag with matching package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node - "$RELEASE_TAG" <<'NODE'
          const fs = require("node:fs")

          const tag = process.argv[2]
          const expected = tag.slice(1)
          const files = [
            "package.json",
            "apps/api/package.json",
            "apps/web/package.json",
            "packages/shared/package.json",
          ]
          for (const file of files) {
            const version = JSON.parse(fs.readFileSync(file, "utf8")).version
            if (version !== expected) {
              throw new Error(`${file} is ${version}; expected ${expected}`)
            }
          }
          NODE

  deploy:
    name: Deploy production
    needs: version-guard
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHAIN_ID: ${{ secrets.CHAIN_ID }}
      RPC_URL: ${{ secrets.RPC_URL }}
      AETHERDEX_HOOK: ${{ secrets.AETHERDEX_HOOK }}
      AETHERDEX_TREASURY: ${{ secrets.AETHERDEX_TREASURY }}
      AETHERDEX_ROUTER: ${{ secrets.AETHERDEX_ROUTER }}
      AETHERDEX_FACTORY: ${{ secrets.AETHERDEX_FACTORY }}
      AETHERDEX_POSITION_MANAGER: ${{ secrets.AETHERDEX_POSITION_MANAGER }}
      AETHERDEX_POOL_MANAGER: ${{ secrets.AETHERDEX_POOL_MANAGER }}
      VITE_REOWN_PROJECT_ID: ${{ secrets.VITE_REOWN_PROJECT_ID }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production inputs
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CHAIN_ID RPC_URL AETHERDEX_HOOK AETHERDEX_TREASURY AETHERDEX_ROUTER AETHERDEX_FACTORY AETHERDEX_POSITION_MANAGER AETHERDEX_POOL_MANAGER VITE_REOWN_PROJECT_ID VITE_API_URL; do
            test -n "${!name:-}" || { echo "Missing production secret: $name" >&2; exit 1; }
          done

      - name: Deploy Cloudflare production infrastructure
        working-directory: infra/alchemy
        run: bun run deploy:production

      - name: Deploy production Pages
        working-directory: infra/alchemy
        run: bun run web:deploy:production

      - name: Smoke test production API
        run: |
          curl --fail --retry 5 --retry-delay 3 "$VITE_API_URL/ping"
          curl --fail --retry 5 --retry-delay 3 "${VITE_API_URL%/api/v1}/health"

  github-release:
    name: Create GitHub release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
